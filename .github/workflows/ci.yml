name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift run HeadroomTests

      - name: Build the app bundle
        run: ./build-app.sh

      - name: Check the offscreen renderer still works
        run: |
          swift build
          .build/debug/Headroom --render "$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
